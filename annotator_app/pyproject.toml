[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-surgical-annotator"
version = "0.1.0"
description = "Desktop surgical annotation app built on a vendored SAM3 runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["annotator*"]

